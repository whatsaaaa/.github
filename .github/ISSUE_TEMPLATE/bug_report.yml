name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. A security problem does not belong here; follow the security policy instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what went wrong. Paste error messages as text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest steps, code or link to a repository that shows the bug.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you use, or the commit.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Whatever matters for this bug, such as the operating system, Node.js, the package manager or the browser, with their versions.
    validations:
      required: false
