name: Feature request
description: An idea for something new, or a question about how to do something
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what is in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it could work. An example of the code or the result you have in mind helps.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds or other approaches you considered.
    validations:
      required: false
